name: Publicar aplicacion Cardputer
on:
  workflow_dispatch:
    inputs:
      app:
        description: Aplicacion en cardputer/pending sin .py
        required: true
        default: prueba_cardputer
      version:
        description: Version
        required: true
        default: '0.1'
permissions:
  contents: read
concurrency:
  group: m5-production
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install cryptography==44.0.3
      - name: Firmar y verificar
        env:
          APP_NAME: ${{ inputs.app }}
          APP_VERSION: ${{ inputs.version }}
          M5_SIGNING_KEY: ${{ secrets.M5_SIGNING_KEY }}
          M5_SIGNING_PASSWORD: ${{ secrets.M5_SIGNING_PASSWORD }}
        run: python -I tools/preparar_cardputer.py
      - name: Publicar commit
        env:
          APP_NAME: ${{ inputs.app }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "cardputer/apps/$APP_NAME.py" cardputer/releases/latest/manifest.json cardputer/releases/latest/manifest.sig
          git commit -m 'Publicar aplicacion Cardputer firmada'
          git push origin HEAD:main
