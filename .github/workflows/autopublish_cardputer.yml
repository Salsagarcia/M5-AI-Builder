name: AutoPublish Cardputer
on:
  push:
    branches: [main]
    paths: ['publication/cardputer.json']
permissions:
  contents: read
concurrency:
  group: m5-production
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - name: Comprobar revision solicitada
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - run: python -m pip install cryptography==44.0.3
      - name: Preparar y firmar conjunto
        env:
          M5_SIGNING_KEY: ${{ secrets.M5_SIGNING_KEY }}
          M5_SIGNING_PASSWORD: ${{ secrets.M5_SIGNING_PASSWORD }}
        run: python -I tools/autopublish_cardputer.py
      - name: Publicar conjunto en un commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cardputer/apps cardputer/releases/latest cardputer/libraries/modules cardputer/libraries/releases/latest cardputer/launcher/releases/latest
          git commit -m 'AutoPublish Cardputer: conjunto firmado'
          git push origin HEAD:main
