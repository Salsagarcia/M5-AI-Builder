name: Publicar Launcher Cardputer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version Launcher
        required: true
        default: '0.8c'
permissions:
  contents: read
concurrency:
  group: m5-production
  cancel-in-progress: false
jobs:
  publicar:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python -m pip install cryptography==44.0.3
      - name: Firmar y verificar
        env:
          LAUNCHER_VERSION: ${{ inputs.version }}
          M5_SIGNING_KEY: ${{ secrets.M5_SIGNING_KEY }}
          M5_SIGNING_PASSWORD: ${{ secrets.M5_SIGNING_PASSWORD }}
        run: python -I tools/preparar_launcher_cardputer.py
      - name: Publicar commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- cardputer/launcher/releases/latest
          git commit -m 'Publicar Launcher Cardputer firmado'
          git push origin HEAD:main
